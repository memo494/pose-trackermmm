name: export-model

# Manual only. A workflow_dispatch workflow can be triggered only once it is on the default branch,
# so this runs after the M0a PR is merged (ARCHITECTURE §8, BUILD_PLAN M0a step 8).
on:
  workflow_dispatch:
    inputs:
      sizes:
        description: "Download-only export: S or WxH entries, comma-separated, no spaces (e.g. 640 or 832x384,960x448). Empty = the normal 320/416 export + PR."
        type: string
        default: ""
      publish_tag:
        description: "With sizes: release tag to upload the files to (created as a pre-release if missing). Must start with 'models' (for example 'models'); never 'latest' or 'models-sweep'."
        type: string
        default: ""
      sweep:
        description: "Run the detection sweep on the model files of the release 'models' and publish sweep.md / sweep.json to the pre-release 'models-sweep'."
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  export:
    runs-on: ubuntu-latest # x86_64
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install export deps
        if: ${{ inputs.sizes == '' && !inputs.sweep }}
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt

      - name: Export yolo26n-pose (320, 416) + goldens
        if: ${{ inputs.sizes == '' && !inputs.sweep }}
        run: python tools/export_model.py

      - name: Freeze resolved deps
        if: ${{ inputs.sizes == '' && !inputs.sweep }}
        run: pip freeze > tools/requirements.lock

      - name: Open PR with the exported model
        if: ${{ inputs.sizes == '' && !inputs.sweep }}
        uses: peter-evans/create-pull-request@v6
        with:
          branch: model-export
          title: "model: export yolo26n-pose (320, 416) + goldens"
          commit-message: "model: export yolo26n-pose at 320 and 416 with golden outputs and model_info.json"
          body: |
            Automated model export (ARCHITECTURE §8). Review the input/output tensor shapes in
            `model/model_info.json` and record the exact column order / scale (settled by the golden
            decode test in M1).

            ---
            _Generated by [Claude Code](https://claude.ai/code)_
          add-paths: |
            model/**
            tools/requirements.lock

      # ---- Download-only export (sizes set): no PR, nothing under model/ (M0c D5) ----
      - name: Check inputs
        if: ${{ inputs.sizes != '' || inputs.publish_tag != '' || inputs.sweep }}
        env:
          SIZES: ${{ inputs.sizes }}
          TAG: ${{ inputs.publish_tag }}
          SWEEP: ${{ inputs.sweep }}
        run: |
          if [ "$SWEEP" = "true" ] && { [ -n "$SIZES" ] || [ -n "$TAG" ]; }; then
            echo "sweep cannot be combined with sizes or publish_tag: the sweep only reads the release 'models' and writes the release 'models-sweep'" >&2
            exit 1
          fi
          if [ "$SWEEP" = "true" ]; then
            exit 0
          fi
          if [ -z "$SIZES" ]; then
            echo "publish_tag needs sizes" >&2
            exit 1
          fi
          if [ -n "$TAG" ]; then
            if [ "$TAG" = "latest" ]; then
              echo "publish_tag must not be 'latest' (the rolling APK release)" >&2
              exit 1
            fi
            if [ "$TAG" = "models-sweep" ]; then
              echo "publish_tag must not be 'models-sweep' (the sweep job is the only writer of that release)" >&2
              exit 1
            fi
            if ! [[ "$TAG" =~ ^models[A-Za-z0-9._-]*$ ]]; then
              echo "publish_tag must start with 'models' and may only contain A-Z a-z 0-9 . _ -" >&2
              exit 1
            fi
          fi

      - name: Install pinned export toolchain
        if: ${{ inputs.sizes != '' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.lock

      - name: Export and check models (download only)
        if: ${{ inputs.sizes != '' }}
        env:
          SIZES: ${{ inputs.sizes }}
        run: python tools/export_model.py --sizes "$SIZES" --out dist-models

      - name: List files in the job summary
        if: ${{ inputs.sizes != '' }}
        run: |
          {
            echo "### Exported models"
            echo '```'
            (cd dist-models && sha256sum -- *)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload models as a workflow artifact
        if: ${{ inputs.sizes != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: models
          path: dist-models/
          if-no-files-found: error

      - name: Publish models to the release
        if: ${{ inputs.sizes != '' && inputs.publish_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.publish_tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --latest=false --title "Models" \
              --notes "Model files to import in the app, built by export-model.yml." \
              --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" dist-models/* --clobber

      # ---- Detection sweep (sweep=true): reads the files of release 'models', exports nothing ----
      - name: Install pinned toolchain for the sweep
        if: ${{ inputs.sweep }}
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.lock
          # tools/requirements.lock pins numpy, opencv-python (provides cv2), ai-edge-litert and ultralytics
          # (bus.jpg comes from its assets), so nothing extra is installed here.

      - name: Download the published model files
        if: ${{ inputs.sweep }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download models -p '*.tflite' -D sweep-models

      - name: Self-test the sweep helpers
        if: ${{ inputs.sweep }}
        run: python tools/model_sweep.py --self-test

      - name: Run the detection sweep
        if: ${{ inputs.sweep }}
        run: python tools/model_sweep.py --models sweep-models --out sweep-out

      - name: Sweep results in the job summary
        if: ${{ inputs.sweep }}
        run: cat sweep-out/sweep.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the sweep as a workflow artifact
        if: ${{ inputs.sweep }}
        uses: actions/upload-artifact@v4
        with:
          name: model-sweep
          path: sweep-out/
          if-no-files-found: error

      - name: Publish the sweep to the release models-sweep
        if: ${{ inputs.sweep }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view models-sweep >/dev/null 2>&1; then
            gh release create models-sweep --prerelease --latest=false --title "Model sweep" \
              --notes "Detection sweep of the published models, built by export-model.yml (sweep)." \
              --target "$GITHUB_SHA"
          fi
          gh release upload models-sweep sweep-out/sweep.md sweep-out/sweep.json --clobber
