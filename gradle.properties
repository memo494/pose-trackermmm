# Project-wide Gradle settings. Proxy settings live in ~/.gradle/gradle.properties
# (written by scripts/cloud-setup.sh) and are never committed.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
# Configuration cache left off for the bootstrap; revisit once all plugins are config-cache safe.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
