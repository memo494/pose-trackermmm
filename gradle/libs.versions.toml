# Version catalog — the single source of truth for dependency versions (ARCHITECTURE §2).
# Pinned to current stable releases, each verified from Google Maven / Maven Central on 2026-11-10.
# NEVER auto-upgraded (AGENTS.md): no Dependabot/Renovate. Bump deliberately, one PR, with a reason.
# litert and litert-gpu MUST always share the same version (ARCHITECTURE §2, §11.6).

[versions]
# Build / language
agp = "8.13.2"                 # Android Gradle Plugin (latest stable 8.x; pairs with Gradle 8.14)
kotlin = "2.4.21"              # ARCHITECTURE §2 (LiteRT 2.3 ships Kotlin 2.4 metadata; matches upstream)
spotless = "8.11.0"
ktlint = "1.8.0"

# SDK levels
compileSdk = "36"              # Android 16: required by current AndroidX (navigationevent/activity/compose)
minSdk = "26"
targetSdk = "35"               # Android 15 — the primary test device (Poco X7 Pro)

# AndroidX / Compose — pinned to the Android-16 (API 36) wave so they compile against compileSdk 36.
# The next wave (Compose 1.12 / BOM 2026.08+, activity 1.13, lifecycle 2.11, core 1.19) requires
# compileSdk 37 + AGP 9; we deliberately stay on AGP 8.13 (ARCHITECTURE §2 era). Bump together with AGP.
composeBom = "2026.06.01"      # animation-core 1.11.4 (API 36); 1.12/BOM 2026.08 needs API 37
coreKtx = "1.18.0"
activityCompose = "1.12.4"
lifecycle = "2.10.0"
coroutines = "1.11.0"

# Inference — used from M0b/M1; pinned now so later milestones are ready
litert = "2.3.2"               # com.google.ai.edge.litert:litert (+ litert-gpu), CompiledModel API
camerax = "1.6.2"              # Preview + ImageAnalysis (ARCHITECTURE §2); wired in M0b

# Tests
junit = "6.1.3"                # JUnit 6 (unified platform+jupiter version); JVM tests in core
truth = "1.4.5"
junit4 = "4.13.2"             # Android-module unit tests (ARCHITECTURE §2)

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }

# Compose (versions resolved by the BOM)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }

# Inference (declared now, wired in M0b)
litert = { group = "com.google.ai.edge.litert", name = "litert", version.ref = "litert" }
litert-gpu = { group = "com.google.ai.edge.litert", name = "litert-gpu", version.ref = "litert" }

# Tests — JVM (core): JUnit 5 (Jupiter) + Truth, versions from the BOM
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
# Tests — Android modules: JUnit 4
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
