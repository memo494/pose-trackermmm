name: android

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # rolling 'latest' release on main
  pull-requests: write # test-summary comment

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # test-count guard compares against the PR base commit

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The Android SDK is preinstalled on ubuntu-latest; no cloud-setup.sh in CI.
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4

      - name: Build, test, lint, assemble
        run: ./gradlew spotlessCheck test lint assembleDebug --console=plain --stacktrace

      - name: Guard @Test count
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/test-count-guard.sh

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Comment test summary on PR
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let tests = 'n/a';
            try { tests = fs.readFileSync('build/test-count.txt', 'utf8').trim(); } catch (e) {}
            const ok = '${{ job.status }}' === 'success';
            const body = [
              `### CI ${ok ? '✅ green' : '❌ red'}`,
              '',
              '- `spotlessCheck test lint assembleDebug`',
              `- @Test count: ${tests}`,
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Publish rolling 'latest' release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="$(ls app/build/outputs/apk/debug/*.apk | head -1)"
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "$apk" \
            --title "latest" \
            --notes "Rolling debug build from main @ ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER})." \
            --target "$GITHUB_SHA"
