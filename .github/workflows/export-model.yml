name: export-model

# Manual only (workflow_dispatch; it can be triggered once the workflow is on the default branch).
# Exports yolo26n-pose at 320 and 416 with verified golden outputs (tools/export_model.py) and
# pushes the result to the `model-export` branch: always the default branch plus the generated
# files only, whichever ref the workflow ran on.
# It does not open the pull request itself: GitHub does not let workflows open pull requests by
# default on personal repositories, and a pull request opened with the workflow token would not
# run CI. A person opens the pull request from the link in the job summary.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest # x86_64
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install export deps
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt

      - name: Self-test the export helpers
        run: python tools/export_model.py --self-test

      - name: Export yolo26n-pose (320, 416) + goldens
        run: python tools/export_model.py

      - name: Freeze resolved deps
        run: pip freeze > tools/requirements.lock

      - name: Push the result to the model-export branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          out="$(mktemp -d)"
          cp -r model "$out/model"
          cp tools/requirements.lock "$out/requirements.lock"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin "$DEFAULT_BRANCH"
          git checkout -f -B model-export FETCH_HEAD
          rm -rf model
          cp -r "$out/model" model
          cp "$out/requirements.lock" tools/requirements.lock
          git add model tools/requirements.lock
          if git diff --cached --quiet; then
            echo "Nothing changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "model: export yolo26n-pose at 320 and 416 with golden outputs" -m "Exported by export-model.yml from ${GITHUB_REF_NAME}@${GITHUB_SHA}."
          git push --force origin model-export
          {
            echo "### Model exported"
            echo "Branch \`model-export\` is \`$DEFAULT_BRANCH\` plus the exported model."
            echo "Open a pull request: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${DEFAULT_BRANCH}...model-export?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
